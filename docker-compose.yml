services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_PATH: /app/data/expense_tracker.db
    volumes:
      - db_data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
